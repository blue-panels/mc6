name: ci-man

on:
  workflow_call:

jobs:
  man:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y go-md2man

      - uses: actions/checkout@v7

      - name: Check the markdown man pages
        run: ./maint/check-man.pl

      - name: Check that the generated man pages are up to date
        run: |
          ./maint/update-man-in.sh
          # A man page in the tree that its markdown source no longer
          # produces means someone edited the generated file, or forgot to
          # run maint/update-man-in.sh after editing the markdown.
          git diff --exit-code -- doc/man/
