name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build'
        required: true
      upload_to_ppa:
        description: 'Upload to the PPA as well'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.repository == 'ilia-maslakov/mcdev'
    outputs:
      version: ${{ steps.build.outputs.version }}

    steps:
      # No ref: the recipes are repository tooling, kept out of the archive by
      # export-ignore, and release-source.sh takes the release content from the
      # tag itself. Checking the tag out would mean older tags cannot be built.
      - uses: actions/checkout@v4
        with:
          # release-source.sh reads the tag object; prepare.sh reads every tag.
          fetch-depth: 0

      - name: Install the bootstrap tooling
        # autogen.sh inside the archive needs these; autopoint in particular is
        # a package of its own on Debian and Ubuntu, only suggested by gettext.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              autoconf automake libtool gettext autopoint

      - name: Build the release archive
        id: build
        run: |
          version="${TAG#v}"
          packaging/release-source.sh "$version" "$TAG" "dist/mc6-$version.tar.gz"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: source-archive
          path: dist/*.tar.gz
          overwrite: true

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A draft: the notes are written by hand. The archive is attached now
          # so that its download link, and its checksum, are settled.
          version="${{ steps.build.outputs.version }}"
          archive="dist/mc6-$version.tar.gz"
          notes="Release notes pending. b2: $(b2sum "$archive" | cut -d' ' -f1)"

          # A rerun, after a failure in one of the builds, must not stop here.
          if gh release view "$TAG" >/dev/null 2>&1; then
              echo "release $TAG exists: replacing the archive"
              gh release upload "$TAG" "$archive" --clobber
          else
              gh release create "$TAG" "$archive" --draft --title "$TAG" --notes "$notes"
          fi

  debian:
    needs: archive
    runs-on: ubuntu-latest
    container: debian:trixie
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.archive.outputs.version }}
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Install the build tooling
        # git first: without it actions/checkout downloads a tarball and
        # prepare.sh has no tags to read.
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
              git ca-certificates build-essential dpkg-dev lintian

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: source-archive
          path: dist

      - name: Build the source and binary packages
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          packaging/prepare.sh "$VERSION" "dist/mc6-$VERSION.tar.gz"

          # Built from the release archive with debian/ copied in, not from the
          # checkout: that keeps the source package free of patches, since the
          # archive carries mc-version.h and no debian directory of its own.
          build=$(mktemp -d)
          cp "dist/mc6-$VERSION.tar.gz" "$build/mc6_$VERSION.orig.tar.gz"
          tar -xf "dist/mc6-$VERSION.tar.gz" -C "$build"
          cp -r debian "$build/mc6-$VERSION/"

          cd "$build/mc6-$VERSION"
          # build-dep reads debian/control directly and names a dependency it
          # cannot satisfy. mk-build-deps went through equivs, where apt simply
          # removed its stub package again and said nothing about the cause.
          apt-get build-dep -y --no-install-recommends ./
          dpkg-buildpackage -us -uc
          cd ..
          lintian --fail-on error --profile debian ./*.changes || lintian_failed=1
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp ./*.deb ./*.dsc ./*.debian.tar.* ./*.changes "$GITHUB_WORKSPACE/out/"
          test -z "${lintian_failed:-}"

      # Also on failure: a lintian error fails the step above, and the packages
      # it produced are what one looks at to understand why.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debian-packages
          path: out/*
          if-no-files-found: warn
          overwrite: true

  fedora:
    needs: archive
    runs-on: ubuntu-latest
    container: fedora:latest
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.archive.outputs.version }}

    steps:
      - name: Install the build tooling
        run: dnf install -y git rpm-build rpmlint 'dnf-command(builddep)'

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: source-archive
          path: dist

      - name: Build the RPMs
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          packaging/prepare.sh "$VERSION" "dist/mc6-$VERSION.tar.gz"
          mkdir -p ~/rpmbuild/SOURCES
          cp "dist/mc6-$VERSION.tar.gz" ~/rpmbuild/SOURCES/
          dnf builddep -y packaging/rpm/mc6.spec
          rpmbuild -ba packaging/rpm/mc6.spec
          rpmlint ~/rpmbuild/RPMS/*/*.rpm || true
          mkdir -p out
          cp ~/rpmbuild/RPMS/*/*.rpm ~/rpmbuild/SRPMS/*.rpm out/

      - uses: actions/upload-artifact@v4
        with:
          name: fedora-packages
          path: out/*
          overwrite: true

  arch:
    needs: archive
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.archive.outputs.version }}

    steps:
      - name: Install the build tooling
        run: pacman -Syu --noconfirm git sudo

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: source-archive
          path: dist

      - name: Build the packages
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          packaging/prepare.sh "$VERSION" "dist/mc6-$VERSION.tar.gz"

          # makepkg refuses to run as root, and finds the archive next to the
          # PKGBUILD instead of downloading it. Its -s installs the dependencies
          # through sudo, so that user needs to use it without a password.
          cp "dist/mc6-$VERSION.tar.gz" packaging/arch/
          useradd -m build
          echo 'build ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/build
          chown -R build packaging/arch
          su build -c 'cd packaging/arch && makepkg -s --noconfirm'
          mkdir -p out
          cp packaging/arch/*.pkg.tar.* out/

      - uses: actions/upload-artifact@v4
        with:
          name: arch-packages
          path: out/*
          overwrite: true

  macos:
    needs: archive
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.archive.outputs.version }}

    # A portability check, not a package: it says whether the release still
    # builds on macOS. The archive is self contained, so nothing else is needed
    # here, not even a checkout.
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: source-archive
          path: dist

      - name: Install the libraries
        # The heavy optional ones, Samba and the Mongo driver, are left out:
        # their plugins are not what this check is about.
        run: brew install glib s-lang pkgconf gettext libssh2 libarchive libmagic

      - name: Build from the release archive
        run: |
          brew_prefix=$(brew --prefix)
          gettext_prefix=$(brew --prefix gettext)

          # Homebrew is not on the default search paths of the compiler, and
          # gettext is keg-only, so libintl has to be pointed at by hand.
          export CPPFLAGS="-I$brew_prefix/include -I$gettext_prefix/include"
          export LDFLAGS="-L$brew_prefix/lib -L$gettext_prefix/lib"
          export PKG_CONFIG_PATH="$brew_prefix/lib/pkgconfig:$(brew --prefix libarchive)/lib/pkgconfig"

          tar -xf "dist/mc6-$VERSION.tar.gz"
          cd "mc6-$VERSION"
          ./configure --prefix="$brew_prefix" --disable-static \
              --with-screen=slang --enable-mcterm=yes
          make -j"$(sysctl -n hw.ncpu)"
          ./src/mc --version

      - name: Keep the configure log of a failed build
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-config-log
          path: mc6-*/config.log
          if-no-files-found: warn
          overwrite: true

  ppa:
    needs: archive
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Set the PPA_SERIES variable to switch this on, as a space separated list
    # of series with their Ubuntu versions: "noble:24.04 jammy:22.04".
    if: vars.PPA_SERIES != ''
    env:
      VERSION: ${{ needs.archive.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: source-archive
          path: dist

      - name: Install dput
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dput

      - name: Import the upload key
        env:
          PPA_GPG_KEY: ${{ secrets.PPA_GPG_KEY }}
        run: |
          test -n "$PPA_GPG_KEY" || { echo "PPA_GPG_KEY is not set" >&2; exit 1; }
          printf '%s\n' "$PPA_GPG_KEY" | gpg --batch --quiet --import
          # This key exists only to sign PPA uploads, so it is the only one here.
          key=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ { print $10; exit }')
          test -n "$key" || { echo "no secret key was imported" >&2; exit 1; }
          echo "SIGN_KEY=$key" >> "$GITHUB_ENV"

      - name: Build and upload the source packages
        env:
          PPA: ${{ vars.PPA_TARGET || 'ppa:il-smind/mc6' }}
          SERIES: ${{ vars.PPA_SERIES }}
          # A tag push publishes. A manual run is a rehearsal unless it asks to
          # publish: a PPA keeps every version it has ever accepted, so an
          # accidental upload cannot be taken back.
          REQUESTED: ${{ github.event_name != 'workflow_dispatch' || inputs.upload_to_ppa }}
        run: |
          if test "$REQUESTED" = true; then
              upload=yes
          else
              upload=no
              echo "rehearsal: building and signing, not uploading to $PPA"
          fi

          UPLOAD="$upload" packaging/ppa-source.sh \
              "$VERSION" "dist/mc6-$VERSION.tar.gz" $SERIES

      - uses: actions/upload-artifact@v4
        with:
          name: ppa-source
          path: dist/ppa/*
          overwrite: true

  publish:
    needs: [debian, fedora, arch]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Runs even when a distribution failed: what did get built is still worth
    # attaching, and rerunning the failed job afterwards adds the rest.
    if: always()

    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: packages
          pattern: '*-packages'
          merge-multiple: true

      - name: Attach the packages to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! ls packages/* >/dev/null 2>&1; then
              echo "nothing was built: nothing to attach"
              exit 0
          fi
          gh release upload "$TAG" packages/* --clobber --repo "$GITHUB_REPOSITORY"
