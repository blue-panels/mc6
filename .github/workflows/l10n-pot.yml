name: l10n-pot

on:
  workflow_dispatch:

jobs:
  pot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gettext
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gettext

      - name: Rebuild the template
        id: pot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The same file list that autogen.sh writes.
          xgettext --keyword=_ --keyword=N_ --keyword=Q_ --output=- \
            $(find lib maint src tests -name '*.[ch]') \
            | sed -ne '/^#:/{s/#://;s/:[0-9]*/\n/g;s/ //g;p;}' \
            | grep -v '^$' | sort | uniq > po/POTFILES.in

          # The same call that po/Makefile makes, without needing a configured
          # build tree.
          xgettext --default-domain=mc --directory=. \
            --add-comments=TRANSLATORS: --keyword=_ --keyword=N_ --keyword=Q_ \
            --files-from=po/POTFILES.in \
            --copyright-holder='Free Software Foundation, Inc.' \
            --package-name='mc' \
            --package-version="$(./version.sh .)" \
            --msgid-bugs-address='https://github.com/blue-panels/mc6/issues' \
            --output=po/mc.pot.new

          # Neither the creation date nor the version string is a change:
          # the version carries the commit count and moves on every push.
          strip() {
            grep -v -e '^"POT-Creation-Date:' -e '^"Project-Id-Version:' "$1"
          }
          if strip po/mc.pot > old.pot && strip po/mc.pot.new > new.pot \
             && cmp -s old.pot new.pot; then
            echo "The template is up to date." >> "$GITHUB_STEP_SUMMARY"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mv po/mc.pot.new po/mc.pot
          rm -f old.pot new.pot
          git switch -C l10n/pot
          git add po/mc.pot
          git commit -m "po: update mc.pot"
          git push --force origin l10n/pot
          echo "changed=true" >> "$GITHUB_OUTPUT"
          {
            echo "Strings in the template: $(grep -c '^msgid ' po/mc.pot)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open the pull request
        if: steps.pot.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          open=$(gh pr list --head l10n/pot --state open --json number --jq '.[].number')
          if [ -n "$open" ]; then
            echo "Pull request #$open is already open and now holds the new template." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          printf '%s\n' \
            'The gettext template no longer matches the sources.' \
            '' \
            'Once this lands in master, Weblate pulls it over the webhook and spreads' \
            'the new strings over the po files, so translators can see them.' > body.md
          gh pr create --base master --head l10n/pot \
            --title "po: update mc.pot" \
            --body-file body.md
