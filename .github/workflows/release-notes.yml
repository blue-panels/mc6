name: Create release notes

on:
  workflow_dispatch:
    inputs:
      milestone:
        description: 'Milestone to describe, for example v6.0.2'
        required: true
      update_release:
        description: 'Also publish: notes into the release, summary onto the milestone'
        type: boolean
        default: false
      commit_changelog:
        description: 'Also commit the CHANGELOG.md section to the default branch'
        type: boolean
        default: false
      publish_wiki:
        description: 'Also publish the page to the wiki'
        type: boolean
        default: false

permissions:
  contents: write
  # The summary goes onto the milestone, and a milestone is an issue to the API.
  issues: write
  # Lets the built-in token reach GitHub Models, so rewriting the entries needs
  # no key of its own.
  models: read

jobs:
  notes:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.repository == 'blue-panels/mc6'

    steps:
      - uses: actions/checkout@v7

      - name: Install gawk
        # The notes are grouped with asorti, which mawk, the default awk on
        # Ubuntu, does not have.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gawk

      - name: Write the notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Which model answers, and where. Left unset, the scripts fall back to
          # GitHub Models on the built-in token -- which GitHub retired on
          # 2026-07-30, so in practice these are what makes the rewriting work.
          # Any endpoint that speaks the OpenAI shape will do; Cloudflare Workers
          # AI does, at
          # https://api.cloudflare.com/client/v4/accounts/<id>/ai/v1/chat/completions
          MODELS_ENDPOINT: ${{ vars.MODELS_ENDPOINT }}
          MODELS_MODEL: ${{ vars.MODELS_MODEL }}
          MODELS_TOKEN: ${{ secrets.MODELS_TOKEN }}
          # Room for the two answers that cover the whole release at once.
          # A reasoning model spends it on its thinking before it writes a
          # word, so the default of the script leaves the answer empty rather
          # than short: v6.0.4 came back with finish_reason "length" and no
          # text, and the notes fell back to the pull request titles. The page
          # keeps the default: it asks once per entry, and a budget this size
          # would put the run over its timeout.
          WHOLE_RELEASE_MAX_TOKENS: ${{ vars.MODELS_MAX_TOKENS || '32000' }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          # Through the environment, not through ${{ }} inside the script: a
          # milestone name is typed by hand and would otherwise be pasted into
          # the shell as it stands.
          MILESTONE: ${{ inputs.milestone }}
        run: |
          # The endpoint is kept as a template, so that the account id is written
          # once in a variable of its own rather than buried in a URL.
          if test -n "${CF_ACCOUNT_ID:-}"; then
              MODELS_ENDPOINT=${MODELS_ENDPOINT//<CF_ACCOUNT_ID>/$CF_ACCOUNT_ID}
              export MODELS_ENDPOINT
          fi

          maint/release_notes.sh "$MILESTONE" --milestone --raw > prs.json

          # A model turns each description into a sentence for a reader. If it
          # is unavailable, or answers with something else, the notes are still
          # written -- with the titles as their authors typed them.
          titles=""
          if MODELS_MAX_TOKENS="$WHOLE_RELEASE_MAX_TOKENS" \
              maint/rewrite_titles.sh prs.json titles.json; then
              titles="--titles-from titles.json"
          else
              echo "::warning::the entries were not rewritten; using the pull request titles"
          fi

          # Unquoted on purpose: either an option and its file, or nothing.
          maint/release_notes.sh "$MILESTONE" --milestone $titles -o notes.md

          # The same sentences without headings or links, which is the form the
          # package changelogs take. prepare.sh reads the section back out of
          # CHANGELOG.md when it builds them, so what a .deb says is what was
          # committed here rather than whatever a model answered that day.
          maint/release_notes.sh "$MILESTONE" --milestone $titles --flat > entries.txt
          maint/update_changelog.sh "$MILESTONE" entries.txt

          # And the long form for the wiki: a paragraph per change, written from
          # the same descriptions. One request per entry, so this is the slow
          # part; the rest of the run stands without it.
          if ! maint/wiki_page.sh "$MILESTONE" "Release-$MILESTONE.md"; then
              echo "::warning::the wiki page was not written"
              rm -f "Release-$MILESTONE.md"
          fi

          # Two or three lines for the places with no room for the list: the
          # tag message, which the package changelogs are made of, and the
          # description of the milestone.
          # With prs.json as well: the headline has to know about the work the
          # notes leave out as infrastructure, or a release made mostly of
          # packaging will advertise a small fix instead.
          if ! MODELS_MAX_TOKENS="$WHOLE_RELEASE_MAX_TOKENS" \
              maint/summarize_release.sh notes.md summary.txt --context prs.json; then
              echo "::warning::no summary was written"
              : > summary.txt
          fi

          # Both are what you read straight after the run.
          {
              if test -s summary.txt; then
                  echo '## Summary, for the tag message'
                  echo
                  sed 's/$/  /' summary.txt
                  echo
              fi
              cat notes.md
              if test -f "Release-$MILESTONE.md"; then
                  echo
                  echo "The page for the wiki is in the release-notes artifact."
              fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: |
            notes.md
            summary.txt
            CHANGELOG.md
            Release-*.md
          overwrite: true
          if-no-files-found: warn

      - name: Commit the changelog
        if: inputs.commit_changelog
        env:
          MILESTONE: ${{ inputs.milestone }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          if git diff --cached --quiet; then
              echo "CHANGELOG.md already says this; nothing to commit"
              exit 0
          fi
          git commit -m "changelog: $MILESTONE"
          # Straight onto the branch: the section is generated, and it was read
          # in this run's summary before this step was asked for.
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Publish the page to the wiki
        if: inputs.publish_wiki
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MILESTONE: ${{ inputs.milestone }}
        run: |
          if test ! -f "Release-$MILESTONE.md"; then
              echo "::warning::there is no page to publish"
              exit 0
          fi
          # The page is in the artifact either way, so a wiki that will not take
          # it is a warning and not a failed run.
          if ! maint/publish_wiki.sh "$MILESTONE" "Release-$MILESTONE.md" summary.txt; then
              echo "::warning::the page was not published; it is in the artifact"
          fi

      - name: Put them where they belong
        if: inputs.update_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MILESTONE: ${{ inputs.milestone }}
        run: |
          if ! gh release view "$MILESTONE" >/dev/null 2>&1; then
              echo "there is no release $MILESTONE yet; run the release workflow first" >&2
              exit 1
          fi
          # A draft stays a draft: this only fills in its body.
          gh release edit "$MILESTONE" --notes-file notes.md

          # The milestone has a description, and this is what it is for.
          if test -s summary.txt; then
              number=$(gh api "repos/$GITHUB_REPOSITORY/milestones" \
                  --jq ".[] | select(.title == \"$MILESTONE\") | .number")
              if test -n "$number"; then
                  gh api -X PATCH "repos/$GITHUB_REPOSITORY/milestones/$number" \
                      -f description="$(cat summary.txt)" --silent
                  echo "described milestone $MILESTONE"
              else
                  echo "::warning::no milestone named $MILESTONE to describe"
              fi
          fi
