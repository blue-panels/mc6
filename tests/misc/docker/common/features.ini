# Build profiles for build-mc.sh -f.  A profile is a group; "configure" is
# appended to the configure line, "cflags" to CFLAGS.  Several may be named,
# comma separated; "-name" takes a group's flags back out.
#
#   build -f all              everything the image can build
#   build -f all,ncurses      the same on ncurses instead of slang
#   build -f all,-arcmc       without the archive plugin
#   build -f minimal          no optional panel plugins, no lua

# "all" takes what the image has and leaves out what it has not, with a
# warning from configure; the profiles named after a plugin insist on it.
[all]
configure = --enable-panel-plugin-sftp=auto --enable-panel-plugin-arcmc=auto --enable-panel-plugin-ftp=auto --enable-panel-plugin-samba=auto --enable-panel-plugin-shell-link=auto --enable-panel-plugin-s3=auto --enable-panel-plugin-mongo=no

[minimal]
configure = --enable-panel-plugin-sftp=no --enable-panel-plugin-arcmc=no --enable-panel-plugin-ftp=no --enable-panel-plugin-samba=no --enable-panel-plugin-shell-link=no --enable-panel-plugin-s3=no --enable-panel-plugin-mongo=no --enable-lua-plugin=no

[arcmc]
configure = --enable-panel-plugin-arcmc

[sftp]
configure = --enable-panel-plugin-sftp

[ftp]
configure = --enable-panel-plugin-ftp

[samba]
configure = --enable-panel-plugin-samba

[shell-link]
configure = --enable-panel-plugin-shell-link

[mongo]
configure = --enable-panel-plugin-mongo

[ncurses]
configure = --with-screen=ncurses

[slang]
configure = --with-screen=slang

[asan]
cflags = -fsanitize=address,undefined -fno-omit-frame-pointer -O1 -g
