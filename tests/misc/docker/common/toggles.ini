# Runtime toggles offered by ui.sh, each an ini value for test -o.
# Format: tag = [section.]key=value | what it means
esc      = old_esc_mode=true | Single press of ESC, no Alt- prefix wait
noesc    = old_esc_mode=false | ESC starts an Alt- sequence (mc default)
extview  = use_internal_view=false | F3 runs the external viewer
extedit  = use_internal_edit=false | F4 runs the external editor
nomini   = Panels.show_mini_info=false | Panels without the mini status line
noconfirm = confirm_delete=false | Delete without asking
lynx     = Panels.navigate_with_arrows=true | Lynx-like motion with the arrows
