# The project name is fixed: the containers, the network and the build volume
# must not be renamed by moving this directory.
name: mc-sandbox

services:
  remote:
    build:
      context: .
      dockerfile: Dockerfile.remote
    hostname: remote
    container_name: mc-stream-remote
    ports:
      - "2222:22"
      - "2121:21"
      - "1445:445"
      - "21100-21110:21100-21110"

  mc:
    build:
      context: .
      dockerfile: Dockerfile.mc
    container_name: mc-stream-mc
    depends_on:
      - remote
    volumes:
      # the working tree, never written to
      - ../../..:/src:ro
      # the build lives in the volume, so nothing lands in the tree
      - work:/work
    tty: true
    stdin_open: true

volumes:
  work:
