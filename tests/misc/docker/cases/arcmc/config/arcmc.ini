# A format arcmc knows nothing about until it reads this file: the suffix is
# made up, the bytes behind it are a tar, and the tools are the ones any image
# has.  What it proves is that a format can be added without a rebuild.
[arcmc-ext]
PKGX=true

[arcmc-ext-params-PKGX]
extension=.pkgx
pack_bin=tar
pack_args=-cf
unpack_bin=tar
unpack_args=-xf
test_bin=tar
test_args=-tf
