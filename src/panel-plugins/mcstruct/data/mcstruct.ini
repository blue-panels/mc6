[mcstruct]
; rows of the structure tree, 0 = what is left after the other zones
TreeLines=14
; def-file zone: auto (right of the tree on wide terminals), right, bottom
DefLayout=auto
; width of the def-file zone on the right, percent
DefWidth=45
; rows of the hex zone, 0 hides it
HexLines=4
; rows of the def-file zone, 0 = what is left after the tree and the hex zone
DefLines=0
; width of the field name column
NameWidth=16
; offset column: none, local, global
OffsetColumn=global
; first column of a grid: none, number, offset
GridRowColumn=offset
; list structures whose name starts with '_' in the F3 menu
ShowHiddenStructures=false
; arrays of fixed-size records longer than this are built on expand
LazyRows=64
; printf format for f32/f64/f80 values
FloatingPointFormat=%g
